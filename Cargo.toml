[package]
name = "vigie"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["mawena"]
description = "Surveillance légère d'un serveur, alertes sur le téléphone"
repository = "https://github.com/mawena/Vigie"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
libc = "0.2"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
codegen-units = 4
