# Tableau de bord de Vigie derrière nginx : /etc/nginx/sites-available/vigie.mawena.cloud
# Puis : sudo ln -s ../sites-available/vigie.mawena.cloud /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d vigie.mawena.cloud      (ajoute le HTTPS et la redirection)
# Vigie demande lui-même le mot de passe (HTTP Basic, section [web] de vigie.toml) :
# ne jamais exposer le tableau de bord sans HTTPS.
server {
    listen 80;
    server_name vigie.mawena.cloud;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
